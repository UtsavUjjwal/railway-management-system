<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RailYatra — Indian Railway Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #0a0f1e; color: #e2e8f0; }
    h1,h2,h3,.font-display { font-family: 'Syne', sans-serif; }

    .hero-bg {
      background: radial-gradient(ellipse at 60% 0%, #1a3a6e44 0%, transparent 60%),
                  radial-gradient(ellipse at 10% 80%, #0f2a5544 0%, transparent 50%),
                  #0a0f1e;
    }
    .track-line {
      background: linear-gradient(90deg, transparent 0%, #f97316 20%, #fb923c 50%, #f97316 80%, transparent 100%);
      height: 2px;
      animation: trainTrack 3s ease-in-out infinite;
    }
    @keyframes trainTrack {
      0%,100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .card-glass {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
    }
    .input-field {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0;
      transition: all 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: #f97316;
      background: rgba(249,115,22,0.08);
      box-shadow: 0 0 0 3px rgba(249,115,22,0.15);
    }
    .input-field::placeholder { color: rgba(255,255,255,0.3); }
    .btn-primary {
      background: linear-gradient(135deg, #ea580c, #f97316);
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(249,115,22,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(249,115,22,0.45);
    }
    .train-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.25s;
    }
    .train-card:hover {
      border-color: rgba(249,115,22,0.4);
      background: rgba(249,115,22,0.05);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(249,115,22,0.12);
    }
    .badge-avail { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .badge-limited { background: rgba(234,179,8,0.15); color: #facc15; border: 1px solid rgba(234,179,8,0.3); }
    .badge-full { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

    .nav-link { transition: color 0.2s; }
    .nav-link:hover { color: #f97316; }

    @keyframes fadeUp {
      from { opacity:0; transform: translateY(20px); }
      to { opacity:1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.5s ease forwards; }
    .fade-up-d1 { animation-delay: 0.1s; opacity:0; }
    .fade-up-d2 { animation-delay: 0.2s; opacity:0; }
    .fade-up-d3 { animation-delay: 0.3s; opacity:0; }

    .loader {
      width: 36px; height: 36px;
      border: 3px solid rgba(249,115,22,0.2);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    datalist option { background: #1e293b; color: #e2e8f0; }
  </style>
</head>
<body class="hero-bg min-h-screen">

  <!-- Nav -->
  <nav class="border-b border-white/5 sticky top-0 z-50" style="background:rgba(10,15,30,0.85);backdrop-filter:blur(20px)">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🚆</span>
        <span class="font-display font-800 text-xl tracking-tight">Rail<span class="text-orange-400">Yatra</span></span>
      </div>
      <div class="flex items-center gap-8 text-sm text-slate-400">
        <a href="/" class="nav-link text-orange-400 font-medium">Search Trains</a>
        <a href="/seat-availability" class="nav-link">Seat Availability</a>
        <a href="/booking" class="nav-link">My Booking</a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <div class="max-w-6xl mx-auto px-6 pt-16 pb-8">
    <div class="fade-up">
      <div class="track-line mb-6 rounded-full max-w-xs"></div>
      <h1 class="font-display text-5xl font-extrabold leading-tight mb-3">
        Book your journey<br/><span class="text-orange-400">across India</span>
      </h1>
      <p class="text-slate-400 text-lg mb-10">Search trains, check availability, and book seats instantly.</p>
    </div>

    <!-- Search Form -->
    <div class="card-glass rounded-2xl p-8 mb-12 fade-up fade-up-d1">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="text-xs text-slate-400 font-medium uppercase tracking-widest mb-2 block">From</label>
          <input id="from" list="stations-list" placeholder="New Delhi" class="input-field w-full rounded-xl px-4 py-3 text-sm"/>
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium uppercase tracking-widest mb-2 block">To</label>
          <input id="to" list="stations-list" placeholder="Mumbai Central" class="input-field w-full rounded-xl px-4 py-3 text-sm"/>
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium uppercase tracking-widest mb-2 block">Date</label>
          <input id="date" type="date" class="input-field w-full rounded-xl px-4 py-3 text-sm"/>
        </div>
        <div class="flex items-end">
          <button onclick="searchTrains()" class="btn-primary w-full rounded-xl py-3 text-sm font-semibold text-white tracking-wide">
            🔍 Search Trains
          </button>
        </div>
      </div>
      <datalist id="stations-list"></datalist>
    </div>

    <!-- Results -->
    <div id="results-section" class="hidden fade-up fade-up-d2">
      <div class="flex items-center justify-between mb-6">
        <h2 class="font-display text-xl font-bold">Available Trains</h2>
        <span id="results-count" class="text-sm text-slate-400"></span>
      </div>
      <div id="loader" class="hidden py-16 text-center">
        <div class="loader mb-4"></div>
        <p class="text-slate-500 text-sm">Searching trains...</p>
      </div>
      <div id="trains-list" class="space-y-4"></div>
    </div>

    <!-- Popular Routes -->
    <div class="fade-up fade-up-d3 mt-8" id="popular-section">
      <h2 class="font-display text-xl font-bold mb-6">All Trains</h2>
      <div id="all-trains" class="space-y-4"></div>
    </div>
  </div>

  <script>
    const API = 'https://your-app-name.onrender.com';

    // Set default date to today
    document.getElementById('date').valueAsDate = new Date();

    // Load stations for autocomplete
    async function loadStations() {
      try {
        const res = await fetch(`${API}/api/stations`);
        const data = await res.json();
        const dl = document.getElementById('stations-list');
        data.stations.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          dl.appendChild(opt);
        });
      } catch(e) {}
    }

    // Load all trains on page load
    async function loadAllTrains() {
      try {
        const res = await fetch(`${API}/api/trains`);
        const data = await res.json();
        renderTrains(data.trains, 'all-trains');
      } catch(e) {
        document.getElementById('all-trains').innerHTML = `
          <div class="text-center py-12 text-slate-500">
            <p class="text-4xl mb-3">🚂</p>
            <p>Could not connect to server. Make sure Flask is running on port 5000.</p>
          </div>`;
      }
    }

    async function searchTrains() {
      const from = document.getElementById('from').value.trim();
      const to = document.getElementById('to').value.trim();
      const date = document.getElementById('date').value;

      if (!from || !to) { alert('Please enter source and destination'); return; }

      document.getElementById('results-section').classList.remove('hidden');
      document.getElementById('popular-section').classList.add('hidden');
      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('trains-list').innerHTML = '';

      try {
        const url = `${API}/api/trains/search?source=${encodeURIComponent(from)}&destination=${encodeURIComponent(to)}&date=${date}`;
        const res = await fetch(url);
        const data = await res.json();
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('results-count').textContent = `${data.count} train(s) found`;
        if (data.trains.length === 0) {
          document.getElementById('trains-list').innerHTML = `
            <div class="text-center py-16 text-slate-500">
              <p class="text-5xl mb-4">🚫</p>
              <p class="text-lg">No trains found for this route on selected date.</p>
            </div>`;
        } else {
          renderTrains(data.trains, 'trains-list');
        }
      } catch(e) {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('trains-list').innerHTML = `<p class="text-red-400 text-center py-8">Error connecting to server.</p>`;
      }
    }

    function availBadge(seats) {
      if (seats === 0) return `<span class="badge-full text-xs px-3 py-1 rounded-full font-medium">FULL</span>`;
      if (seats <= 20) return `<span class="badge-limited text-xs px-3 py-1 rounded-full font-medium">${seats} seats left</span>`;
      return `<span class="badge-avail text-xs px-3 py-1 rounded-full font-medium">${seats} available</span>`;
    }

    function renderTrains(trains, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      trains.forEach(t => {
        const card = document.createElement('div');
        card.className = 'train-card rounded-2xl p-6 cursor-pointer';
        card.innerHTML = `
          <div class="flex flex-col md:flex-row md:items-center gap-4">
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-3">
                <span class="text-orange-400 font-display font-bold text-lg">${t.train_number}</span>
                <span class="text-white font-semibold">${t.train_name}</span>
                ${availBadge(t.available_seats)}
              </div>
              <div class="flex items-center gap-4 text-sm">
                <div class="text-center">
                  <p class="font-display font-bold text-xl text-white">${t.departure_time}</p>
                  <p class="text-slate-400 mt-0.5">${t.source}</p>
                </div>
                <div class="flex-1 flex flex-col items-center">
                  <div class="w-full flex items-center gap-1">
                    <div class="h-px flex-1 bg-slate-600"></div>
                    <span class="text-slate-500 text-xs">🚆</span>
                    <div class="h-px flex-1 bg-slate-600"></div>
                  </div>
                  <p class="text-slate-500 text-xs mt-1">${t.days_of_operation}</p>
                </div>
                <div class="text-center">
                  <p class="font-display font-bold text-xl text-white">${t.arrival_time}</p>
                  <p class="text-slate-400 mt-0.5">${t.destination}</p>
                </div>
              </div>
            </div>
            <div class="flex md:flex-col items-center md:items-end gap-4 md:gap-2">
              <div class="text-right">
                <p class="text-2xl font-display font-bold text-orange-400">₹${t.fare}</p>
                <p class="text-slate-500 text-xs">per person</p>
              </div>
              <div class="flex gap-2">
                <a href="/seat-availability?train_id=${t.id}" class="px-4 py-2 rounded-xl text-xs font-medium border border-white/10 text-slate-300 hover:border-orange-400/40 hover:text-orange-400 transition-all">Seats</a>
                <a href="/booking?train_id=${t.id}&date=${document.getElementById('date').value || ''}" class="btn-primary px-5 py-2 rounded-xl text-xs font-semibold text-white">Book Now</a>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    loadStations();
    loadAllTrains();
  </script>
</body>
</html>
