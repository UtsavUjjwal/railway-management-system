<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seat Availability — RailYatra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root { --navy:#1a2744; --blue:#2563eb; --accent:#f59e0b; --light:#f8f9fc; --border:#e2e8f0; --text:#1e293b; --muted:#64748b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Mulish',sans-serif; background:var(--light); color:var(--text); }
    .font-display { font-family:'Playfair Display',serif; }
    nav { background:var(--navy); }
    .nav-link { color:rgba(255,255,255,0.7); transition:color 0.2s; font-size:14px; text-decoration:none; }
    .nav-link:hover,.nav-link.active { color:var(--accent); }
    .card { background:white; border:1.5px solid var(--border); border-radius:14px; padding:24px; }
    label { font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:6px; }
    .field { width:100%; border:1.5px solid var(--border); border-radius:10px; padding:11px 14px; font-family:'Mulish',sans-serif; font-size:14px; color:var(--text); background:#fafbfc; transition:all 0.2s; outline:none; }
    .field:focus { border-color:var(--blue); background:white; box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
    .btn-primary { background:var(--blue); color:white; border:none; border-radius:10px; padding:12px 24px; font-family:'Mulish',sans-serif; font-weight:700; font-size:14px; cursor:pointer; width:100%; transition:all 0.2s; }
    .btn-primary:hover { background:#1d4ed8; transform:translateY(-1px); box-shadow:0 4px 16px rgba(37,99,235,0.3); }
    .seat-avail { background:#f0fdf4; border:1.5px solid #86efac; color:#16a34a; border-radius:8px; padding:8px 4px; text-align:center; font-size:11px; font-weight:700; transition:all 0.15s; }
    .seat-avail:hover { background:#dcfce7; transform:scale(1.05); }
    .seat-booked { background:#fef2f2; border:1.5px solid #fca5a5; color:#dc2626; border-radius:8px; padding:8px 4px; text-align:center; font-size:11px; font-weight:600; opacity:0.7; }
    .stat-box { background:white; border:1.5px solid var(--border); border-radius:12px; padding:16px 20px; text-align:center; }
    .stat-num { font-family:'Playfair Display',serif; font-size:28px; font-weight:700; }
    .loader { width:32px; height:32px; border:3px solid #e2e8f0; border-top-color:var(--blue); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation:fadeUp 0.35s ease forwards; }
    .page-header { background:var(--navy); padding:32px 24px 32px; }
  </style>
</head>
<body>
  <nav>
    <div style="max-width:1100px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;">
      <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
        <span style="font-size:22px;">🚆</span>
        <span class="font-display" style="color:white;font-size:20px;font-weight:700;">Rail<span style="color:var(--accent)">Yatra</span></span>
      </a>
      <div style="display:flex;gap:28px;align-items:center;">
        <a href="/" class="nav-link">Search</a>
        <a href="/seat-availability" class="nav-link active">Seat Map</a>
        <a href="/booking" class="nav-link">Booking</a>
        <a href="/booking" style="background:var(--accent);color:var(--navy);padding:7px 18px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;">Check PNR</a>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <div class="page-header">
    <div style="max-width:1100px;margin:0 auto;">
      <p style="color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:6px;">← <a href="/" style="color:rgba(255,255,255,0.5);text-decoration:none;">Back to Search</a></p>
      <h1 class="font-display" style="color:white;font-size:32px;">Seat Availability</h1>
      <p style="color:rgba(255,255,255,0.5);font-size:14px;margin-top:6px;">Check real-time coach-wise seat map for any train</p>
    </div>
  </div>

  <div style="max-width:1100px;margin:0 auto;padding:32px 24px 60px;">

    <!-- Controls -->
    <div class="card fade-up" style="margin-bottom:24px;">
      <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:end;">
        <div>
          <label>Select Train</label>
          <select id="train-select" onchange="onTrainChange()" class="field">
            <option value="">Choose a train...</option>
          </select>
        </div>
        <div>
          <label>Journey Date</label>
          <input id="journey-date" type="date" class="field"/>
        </div>
        <div>
          <button class="btn-primary" onclick="loadSeats()" style="white-space:nowrap;">Check Seats</button>
        </div>
      </div>
    </div>

    <!-- Train Quick Info -->
    <div id="train-info" style="display:none;margin-bottom:24px;" class="fade-up">
      <div style="background:var(--navy);border-radius:14px;padding:20px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;">
        <div>
          <p id="info-name" style="color:white;font-weight:700;font-size:17px;"></p>
          <p id="info-route" style="color:rgba(255,255,255,0.5);font-size:13px;margin-top:3px;"></p>
        </div>
        <div style="display:flex;gap:20px;">
          <div style="text-align:center;">
            <p id="info-avail" style="font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#4ade80;"></p>
            <p style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">Available</p>
          </div>
          <div style="text-align:center;">
            <p id="info-booked" style="font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#f87171;"></p>
            <p style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">Booked</p>
          </div>
          <div style="text-align:center;">
            <p id="info-total" style="font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:rgba(255,255,255,0.8);"></p>
            <p style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">Total</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Legend -->
    <div id="legend" style="display:none;margin-bottom:20px;display:none;">
      <div style="display:flex;align-items:center;gap:20px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="seat-avail" style="width:36px;padding:5px;">A1</div>
          <span style="font-size:13px;color:var(--muted);">Available</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="seat-booked" style="width:36px;padding:5px;">B2</div>
          <span style="font-size:13px;color:var(--muted);">Booked</span>
        </div>
      </div>
    </div>

    <!-- Loader -->
    <div id="loader" style="display:none;padding:60px;text-align:center;">
      <div class="loader" style="margin-bottom:14px;"></div>
      <p style="color:var(--muted);font-size:13px;">Loading seat map...</p>
    </div>

    <!-- Seat Map -->
    <div id="seat-map" style="display:none;" class="fade-up"></div>
  </div>

<script>
  const API = 'https://rlms.onrender.com';
  document.getElementById('journey-date').valueAsDate = new Date();

  async function loadTrains() {
    try {
      const res = await fetch(`${API}/api/trains`);
      const data = await res.json();
      const sel = document.getElementById('train-select');
      data.trains.forEach(t => {
        const o = document.createElement('option');
        o.value = t.id;
        o.textContent = `${t.train_number} — ${t.train_name} (${t.source} → ${t.destination})`;
        sel.appendChild(o);
      });
      const params = new URLSearchParams(window.location.search);
      if (params.get('train_id')) { sel.value = params.get('train_id'); loadSeats(); }
    } catch(e) {}
  }

  function onTrainChange() {}

  async function loadSeats() {
    const trainId = document.getElementById('train-select').value;
    const date = document.getElementById('journey-date').value;
    if (!trainId) { alert('Please select a train'); return; }
    document.getElementById('loader').style.display = 'block';
    document.getElementById('seat-map').style.display = 'none';
    document.getElementById('train-info').style.display = 'none';
    document.getElementById('legend').style.display = 'none';
    try {
      const res = await fetch(`${API}/api/seats/${trainId}?date=${date}`);
      const data = await res.json();
      document.getElementById('loader').style.display = 'none';
      document.getElementById('info-name').textContent = `${data.train.train_number} · ${data.train.train_name}`;
      document.getElementById('info-route').textContent = `${data.train.source} → ${data.train.destination} · Departs ${data.train.departure_time} · Arrives ${data.train.arrival_time}`;
      document.getElementById('info-avail').textContent = data.available_seats;
      document.getElementById('info-booked').textContent = data.booked_seats;
      document.getElementById('info-total').textContent = data.total_seats;
      document.getElementById('train-info').style.display = 'block';
      document.getElementById('legend').style.display = 'flex';

      const mapEl = document.getElementById('seat-map');
      mapEl.innerHTML = '';

      data.coaches.forEach(coach => {
        const section = document.createElement('div');
        section.className = 'card fade-up';
        section.style.marginBottom = '16px';

        const avail = coach.seats.filter(s => s.available).length;
        section.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="background:var(--navy);color:white;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;">${coach.coach}</div>
              <div>
                <p style="font-weight:700;font-size:15px;">Coach ${coach.coach}</p>
                <p style="font-size:12px;color:var(--muted);">${avail} of ${coach.seats.length} seats available</p>
              </div>
            </div>
            <div style="background:${avail > 0 ? '#f0fdf4' : '#fef2f2'};color:${avail > 0 ? '#16a34a' : '#dc2626'};border:1px solid ${avail > 0 ? '#bbf7d0' : '#fecaca'};padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;">
              ${avail > 0 ? avail + ' Free' : 'Full'}
            </div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;">
            ${coach.seats.map(s => `
              <div class="${s.available ? 'seat-avail' : 'seat-booked'}">${s.id}</div>
            `).join('')}
          </div>
        `;
        mapEl.appendChild(section);
      });

      if (data.available_seats > 0) {
        const bookDiv = document.createElement('div');
        bookDiv.style.textAlign = 'center';
        bookDiv.style.marginTop = '24px';
        bookDiv.innerHTML = `
          <p style="color:var(--muted);font-size:13px;margin-bottom:12px;">${data.available_seats} seats available for ${date}</p>
          <a href="/booking?train_id=${trainId}&date=${date}" style="background:var(--accent);color:var(--navy);padding:12px 32px;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;display:inline-block;">Book a Seat →</a>
        `;
        mapEl.appendChild(bookDiv);
      } else {
        const fullDiv = document.createElement('div');
        fullDiv.style.cssText = 'text-align:center;padding:24px;background:#fef2f2;border-radius:12px;margin-top:16px;';
        fullDiv.innerHTML = `<p style="color:#dc2626;font-weight:700;">No seats available for this date.</p>`;
        mapEl.appendChild(fullDiv);
      }

      mapEl.style.display = 'block';
    } catch(e) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('seat-map').innerHTML = '<p style="color:#dc2626;text-align:center;padding:32px;">Error loading seat map.</p>';
      document.getElementById('seat-map').style.display = 'block';
    }
  }

  loadTrains();
</script>
</body>
</html>
