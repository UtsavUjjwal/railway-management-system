<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seat Availability — RailYatra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #0a0f1e; color: #e2e8f0; }
    h1,h2,h3,.font-display { font-family: 'Syne', sans-serif; }
    .card-glass { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); }
    .input-field { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; transition: all 0.2s; }
    .input-field:focus { outline: none; border-color: #f97316; background: rgba(249,115,22,0.08); box-shadow: 0 0 0 3px rgba(249,115,22,0.15); }
    .input-field::placeholder { color: rgba(255,255,255,0.3); }
    .btn-primary { background: linear-gradient(135deg, #ea580c, #f97316); transition: all 0.2s; box-shadow: 0 4px 20px rgba(249,115,22,0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(249,115,22,0.45); }
    .nav-link { transition: color 0.2s; }
    .nav-link:hover { color: #f97316; }
    .seat-avail {
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.35);
      color: #4ade80;
      transition: all 0.15s;
      cursor: default;
    }
    .seat-booked {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: rgba(239,68,68,0.5);
    }
    .loader { width: 36px; height: 36px; border: 3px solid rgba(249,115,22,0.2); border-top-color: #f97316; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.4s ease forwards; }
  </style>
</head>
<body class="min-h-screen" style="background: radial-gradient(ellipse at 70% 10%, #1a3a6e33 0%, transparent 55%), #0a0f1e;">

  <nav class="border-b border-white/5 sticky top-0 z-50" style="background:rgba(10,15,30,0.85);backdrop-filter:blur(20px)">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-2">
          <span class="text-2xl">🚆</span>
          <span class="font-display font-800 text-xl tracking-tight">Rail<span class="text-orange-400">Yatra</span></span>
        </a>
      </div>
      <div class="flex items-center gap-8 text-sm text-slate-400">
        <a href="/" class="nav-link">Search Trains</a>
        <a href="/seat-availability" class="nav-link text-orange-400 font-medium">Seat Availability</a>
        <a href="/booking" class="nav-link">My Booking</a>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 pt-12 pb-16">
    <h1 class="font-display text-4xl font-extrabold mb-2">Seat <span class="text-orange-400">Availability</span></h1>
    <p class="text-slate-400 mb-8">Check real-time seat availability for any train.</p>

    <!-- Controls -->
    <div class="card-glass rounded-2xl p-6 mb-8 fade-up">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="text-xs text-slate-400 uppercase tracking-widest mb-2 block">Train</label>
          <select id="train-select" class="input-field w-full rounded-xl px-4 py-3 text-sm">
            <option value="">Select a train...</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-400 uppercase tracking-widest mb-2 block">Journey Date</label>
          <input id="journey-date" type="date" class="input-field w-full rounded-xl px-4 py-3 text-sm"/>
        </div>
        <div class="flex items-end">
          <button onclick="loadSeats()" class="btn-primary w-full rounded-xl py-3 text-sm font-semibold text-white">Check Availability</button>
        </div>
      </div>
    </div>

    <!-- Train Info Bar -->
    <div id="train-info" class="hidden card-glass rounded-2xl p-5 mb-6 fade-up">
      <div class="flex flex-wrap gap-6 items-center">
        <div>
          <p class="text-xs text-slate-500 mb-1">Train</p>
          <p id="info-train" class="font-display font-bold text-lg text-white"></p>
        </div>
        <div>
          <p class="text-xs text-slate-500 mb-1">Route</p>
          <p id="info-route" class="font-semibold text-slate-200"></p>
        </div>
        <div class="ml-auto flex gap-6 text-center">
          <div>
            <p id="info-avail" class="font-display font-bold text-2xl text-green-400"></p>
            <p class="text-xs text-slate-500">Available</p>
          </div>
          <div>
            <p id="info-booked" class="font-display font-bold text-2xl text-red-400"></p>
            <p class="text-xs text-slate-500">Booked</p>
          </div>
          <div>
            <p id="info-total" class="font-display font-bold text-2xl text-slate-300"></p>
            <p class="text-xs text-slate-500">Total</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Legend -->
    <div id="legend" class="hidden flex items-center gap-6 mb-6 text-sm">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded seat-avail flex items-center justify-center text-xs">✓</div>
        <span class="text-slate-400">Available</span>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded seat-booked flex items-center justify-center text-xs">✕</div>
        <span class="text-slate-400">Booked</span>
      </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="hidden py-16 text-center">
      <div class="loader mb-4"></div>
      <p class="text-slate-500 text-sm">Loading seat map...</p>
    </div>

    <!-- Seat Map -->
    <div id="seat-map" class="hidden fade-up"></div>
  </div>

  <script>
    const API = 'https://your-app-name.onrender.com';
    let allTrains = [];

    document.getElementById('journey-date').valueAsDate = new Date();

    async function loadTrains() {
      try {
        const res = await fetch(`${API}/api/trains`);
        const data = await res.json();
        allTrains = data.trains;
        const sel = document.getElementById('train-select');
        data.trains.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = `${t.train_number} — ${t.train_name} (${t.source} → ${t.destination})`;
          sel.appendChild(opt);
        });
        // Auto-select from URL params
        const params = new URLSearchParams(window.location.search);
        if (params.get('train_id')) {
          sel.value = params.get('train_id');
          loadSeats();
        }
      } catch(e) {}
    }

    async function loadSeats() {
      const trainId = document.getElementById('train-select').value;
      const date = document.getElementById('journey-date').value;
      if (!trainId) { alert('Please select a train'); return; }

      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('seat-map').classList.add('hidden');
      document.getElementById('train-info').classList.add('hidden');
      document.getElementById('legend').classList.add('hidden');

      try {
        const res = await fetch(`${API}/api/seats/${trainId}?date=${date}`);
        const data = await res.json();
        document.getElementById('loader').classList.add('hidden');

        // Fill info bar
        document.getElementById('info-train').textContent = `${data.train.train_number} · ${data.train.train_name}`;
        document.getElementById('info-route').textContent = `${data.train.source} → ${data.train.destination}`;
        document.getElementById('info-avail').textContent = data.available_seats;
        document.getElementById('info-booked').textContent = data.booked_seats;
        document.getElementById('info-total').textContent = data.total_seats;
        document.getElementById('train-info').classList.remove('hidden');
        document.getElementById('legend').classList.remove('hidden');

        // Build seat map
        const mapEl = document.getElementById('seat-map');
        mapEl.innerHTML = '';
        data.coaches.forEach(coach => {
          const section = document.createElement('div');
          section.className = 'card-glass rounded-2xl p-6 mb-6';
          section.innerHTML = `
            <h3 class="font-display font-bold text-lg mb-4 text-orange-300">Coach ${coach.coach}</h3>
            <div class="grid gap-2" style="grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));">
              ${coach.seats.map(s => `
                <div class="rounded-lg py-2 text-center text-xs font-semibold ${s.available ? 'seat-avail' : 'seat-booked'}">
                  ${s.id}
                </div>
              `).join('')}
            </div>
          `;
          mapEl.appendChild(section);
        });

        mapEl.classList.remove('hidden');

        // Book now button
        const bookBtn = document.createElement('div');
        bookBtn.className = 'text-center mt-6';
        if (data.available_seats > 0) {
          bookBtn.innerHTML = `<a href="/booking?train_id=${trainId}&date=${date}" class="btn-primary inline-block px-10 py-3 rounded-xl text-sm font-semibold text-white">Book a Seat →</a>`;
        } else {
          bookBtn.innerHTML = `<p class="text-red-400 font-semibold text-lg">No seats available for this date.</p>`;
        }
        mapEl.appendChild(bookBtn);

      } catch(e) {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('seat-map').innerHTML = '<p class="text-red-400 text-center py-8">Error loading seat map.</p>';
        document.getElementById('seat-map').classList.remove('hidden');
      }
    }

    loadTrains();
  </script>
</body>
</html>
